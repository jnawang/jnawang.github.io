  <title
     id="title">Thermal and resource controls on respiratory carbon feedback</title>
  <desc
     id="desc">An oval carbon–climate feedback loop surrounds four mechanisms. Global warming connects in blue to water limitation and substrate availability, and in green to thermal acclimation of plant respiration and thermal adaptation of microbial respiration. Both resource conditions feed both respiration responses. The responses connect to respiratory carbon dioxide release.</desc>
