  <title
     id="title">Conceptual draft: a dammed river as a complex social–ecological system</title>
  <desc
     id="desc">Dam operations, human needs, and climate drive cascading changes in flow, temperature, and sediment, followed by riparian vegetation degradation, habitat redistribution, and declines in fish abundance and diversity. Context-dependent responses may cross thresholds, motivating adaptive management.</desc>
