  <title
     id="title">Carbon–climate feedbacks: uptake and release</title>
  <desc
     id="desc">Original image-led diagram. Human emissions increase atmospheric carbon dioxide and warming. A green negative-feedback loop shows carbon dioxide uptake by plants. A red positive-feedback loop shows fire, plant respiration, and microbial respiration releasing carbon dioxide back to the atmosphere.</desc>
