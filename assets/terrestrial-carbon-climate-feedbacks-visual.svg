         offset="0"
         stop-color="#e9f2f3"
         id="stop1" />
      <stop
         offset="1"
         stop-color="#f8f7f1"
         id="stop2" />
    </linearGradient>
    <linearGradient
       id="shade"
       x2="0"
       y2="1">
      <stop
         offset="0"
         stop-color="#0b292d"
         stop-opacity="0"
         id="stop3" />
      <stop
         offset="1"
         stop-color="#0b292d"
         stop-opacity=".88"
         id="stop4" />
    </linearGradient>
    <marker
